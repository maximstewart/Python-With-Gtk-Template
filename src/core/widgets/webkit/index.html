<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>Example</title>
    <link rel="shortcut icon" href="fave_icon.png">
    <!-- <link rel="stylesheet" href="resources/css/base.css">-->
    <!-- <link rel="stylesheet" href="resources/css/main.css">-->
    <style>
        html, body {
            background-color: red;
            color: white;
        }
    </style>
</head>
<body>


    <h1>Hello, World!</h1>


    <!-- <script src="resources/js/.js" charset="utf-8"></script>-->
    <script>
        function sayHelloWorld() {
            console.log("Hello, World!");
        }

        window.addEventListener("load", () => {
            window.webkit.messageHandlers.logger.postMessage("Hello, World!");

            // Note: Events can be generic which means that without 'event_type'
            // it's mapped to GenericEvent which is just BaseEvent under the hood.
            // const message = '{"action": "alert", "content": "' + btoa("Hello, World!") + '"}';
            const message = '{"event_type": "display_message", "topic": "alert", "message": "' + btoa("Hello, World!") + '"}';
            window.webkit.messageHandlers.backend.postMessage(message);
        });
    </script>
</body>
</html>
